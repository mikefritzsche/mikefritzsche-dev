services:
  dev-mikefritzsche-react-app:
    container_name: dev-mikefritzsche-react-app
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: runner  # Specifies which stage to stop at
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev-mikefritzsche-react-app.rule=Host(`dev.mikefritzsche.local`)"
      - "traefik.http.services.dev-mikefritzsche-react-app.loadbalancer.server.port=5173"
    networks:
      - proxy

networks:
  proxy:
    external: true
